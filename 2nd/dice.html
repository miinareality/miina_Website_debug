<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ダイス - ミィナのWebサイト</title>
    <link rel="icon" type="image/x-icon" href="/miina_website/favicon.ico">
    <link rel="apple-touch-icon" href="/miina_website/favicon.ico">
    <link rel="stylesheet" href="../style.css">
    <style>
        .dice-history-section {
            position: relative;
        }

        .dice-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .dice-history-header h3 {
            margin: 0;
        }

        .clear-history-button {
            margin-left: auto;
            white-space: nowrap;
        }
    </style>
</head>
<body>

<!-- メニューボタン -->
<button id="menuButton" class="menu-button" onclick="toggleMenu()">
    ☰ メニュー
</button>

<!-- 右側メニュー -->
<nav id="sideMenu" class="side-menu">
<h2>メニュー</h2>
<a href="../">🏠 ホーム</a>
<a href="2nd/dice.html">🎲 ダイス</a>
<a href="2nd/member.html">🙍 バッチ取得者への待遇</a>
<a href="2nd/materials.html">🖼 使用素材</a>
<a href="2nd/business.html">💼 企業様への連絡</a>
<a href="debug.html">⚙ デバック</a>
<a href="2nd/login.html">🔐 ログイン</a>
</nav>

<section class="content">
    <h2>🎲 お遊び用ダイスロール</h2>

    <p>「2d6」や「2d6+6d8」のように入力してください。</p>

    <input type="text" id="diceInput" placeholder="例：2d6+6d8" value=""
           onkeydown="if (event.key === 'Enter') rollDice()">

    <button onclick="rollDice()">振る！</button>
    <button onclick="resetDice()">リセット</button>

    <div id="diceResult"></div>
</section>

<!-- ダイス結果ログ -->
<section class="content dice-history-section">
    <div class="dice-history-header">
        <h3>📜 ダイス結果ログ（最大10件）</h3>
        <button class="clear-history-button" onclick="clearDiceResults()">クリア</button>
    </div>
    <div id="diceResultHistory"></div>
</section>

<!-- ダイス式ログ -->
<section class="content dice-history-section">
    <div class="dice-history-header">
        <h3>🎲 ダイス式ログ（最大6件）</h3>
        <button class="clear-history-button" onclick="clearDiceHistory()">クリア</button>
    </div>
    <div id="diceHistory">
        <!-- dicelog.json + LocalStorageからダイスボタンを自動生成 -->
    </div>
</section>

<script>
/* =========================================================
   ダイス履歴
   ・ダイス結果ログ：LocalStorage 最大10件
   ・ダイス式ログ：LocalStorage 最大3件 + dicelog.json 最大3件
   ========================================================= */

const DICE_RESULTS_KEY = "miina_dice_results";
const DICE_HISTORY_KEY = "miina_dice_history";

function readLocalArray(key) {
    try {
        const raw = localStorage.getItem(key);
        if (!raw) return [];
        const data = JSON.parse(raw);
        return Array.isArray(data) ? data : [];
    } catch (error) {
        console.error("LocalStorageの読み込みに失敗しました:", error);
        return [];
    }
}

function writeLocalArray(key, data, maxItems) {
    try {
        localStorage.setItem(key, JSON.stringify(data.slice(0, maxItems)));
    } catch (error) {
        console.error("LocalStorageへの保存に失敗しました:", error);
    }
}

function removeLocal(key) {
    try {
        localStorage.removeItem(key);
    } catch (error) {
        console.error("LocalStorageの削除に失敗しました:", error);
    }
}


/* ダイス結果ログ 最大10件 */
function getDiceResults() {
    return readLocalArray(DICE_RESULTS_KEY).slice(0, 10);
}

function saveDiceResult(input, total) {
    const results = getDiceResults();
    results.unshift({ expression: input, total });
    writeLocalArray(DICE_RESULTS_KEY, results, 10);
    displayDiceResults();
}

function displayDiceResults() {
    const container = document.getElementById("diceResultHistory");
    if (!container) return;

    container.innerHTML = "";

    getDiceResults().forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `${item.expression} → ${item.total}`;
        button.addEventListener("click", () => {
            document.getElementById("diceInput").value = item.expression;
        });
        container.appendChild(button);
    });
}

/* ダイス式ログ LocalStorage側は最大3件 */
function getDiceHistory() {
    return readLocalArray(DICE_HISTORY_KEY).filter(item => typeof item === "string").slice(0, 3);
}

function saveDiceHistory(input) {
    let history = getDiceHistory().filter(dice => dice !== input);
    history.unshift(input);
    writeLocalArray(DICE_HISTORY_KEY, history, 3);
    loadDiceHistory();
}

/* JSON + LocalStorageのダイス式を表示 */
async function loadDiceHistory() {
    const historyContainer = document.getElementById("diceHistory");
    if (!historyContainer) return;

    historyContainer.innerHTML = "";

    let jsonHistory = [];

    try {
        const response = await fetch("dicelog.json", { cache: "no-store" });
        if (!response.ok) throw new Error("JSONの読み込みに失敗しました");

        const data = await response.json();
        if (Array.isArray(data.history)) {
            jsonHistory = data.history.filter(item => typeof item === "string");
        }
    } catch (error) {
        console.error("dicelog.jsonの読み込みに失敗しました:", error);
    }

    const combinedHistory = [];

    for (const dice of [...jsonHistory, ...getDiceHistory()]) {
        if (!combinedHistory.includes(dice)) {
            combinedHistory.push(dice);
        }
        if (combinedHistory.length >= 6) break;
    }

    combinedHistory.forEach(dice => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = dice;
        button.addEventListener("click", () => {
            document.getElementById("diceInput").value = dice;
        });
        historyContainer.appendChild(button);
    });
}

/* ダイスロール */
function rollDice() {
    const input = document.getElementById("diceInput").value.trim();
    const result = document.getElementById("diceResult");

    if (!input) {
        result.textContent = "ダイスを入力してください。";
        return;
    }

    const terms = input.split("+").map(term => term.trim());
    let total = 0;
    const details = [];

    for (const term of terms) {
        if (/^\d+$/.test(term)) {
            const value = Number(term);
            total += value;
            details.push(`<div class="dice-log">${value}</div>`);
            continue;
        }

        const match = term.match(/^(\d+)[dD](\d+)$/);
        if (!match) {
            result.textContent = `「${term}」の形式が正しくありません。`;
            return;
        }

        const diceCount = Number(match[1]);
        const diceSides = Number(match[2]);

        if (diceCount <= 0 || diceSides <= 0) {
            result.textContent = "1以上の数字を入力してください。";
            return;
        }

        if (diceCount > 100 || diceSides > 1000) {
            result.textContent = "ダイスの数は100個、面数は1000面までです。";
            return;
        }

        const rolls = [];
        for (let i = 0; i < diceCount; i++) {
            rolls.push(Math.floor(Math.random() * diceSides) + 1);
        }

        const diceTotal = rolls.reduce((sum, value) => sum + value, 0);
        total += diceTotal;

        details.push(`
            <div class="dice-log">
                ${diceCount}d${diceSides}[${rolls.join(" + ")}]
            </div>
        `);
    }

    result.innerHTML = `${details.join("")}<p><strong>合計：${total}</strong></p>`;

    saveDiceResult(input, total);
    saveDiceHistory(input);
}

/* 履歴クリア */
function clearDiceResults() {
    removeLocal(DICE_RESULTS_KEY);
    displayDiceResults();
}

function clearDiceHistory() {
    removeLocal(DICE_HISTORY_KEY);
    loadDiceHistory();
}

/* リセット */
function resetDice() {
    document.getElementById("diceResult").innerHTML = "";
}

/* メニュー */
function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    menu.classList.toggle("open");
}

document.querySelectorAll("#sideMenu a").forEach(link => {
    link.addEventListener("click", () => {
        document.getElementById("sideMenu").classList.remove("open");
    });
});

document.addEventListener("DOMContentLoaded", () => {
    displayDiceResults();
    loadDiceHistory();
});
</script>
<!-- 共通アカウント状態 -->
<div id="account-status" class="account-status-collapsed"
     role="button"
     tabindex="0"
     aria-expanded="false"
     aria-label="アカウント状態を開く">
    <div id="account-status-toggle" aria-hidden="true">☰</div>
    <div id="account-status-panel">
        <h3>アカウント状態</h3>
        <div id="account-status-content">読み込み中...</div>
    </div>
</div>
<script src="../account-status.js"></script></body>
</html>
