<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモ帳 - ミィナのWebサイト</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .memo-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .memo-box {
            background: rgba(255,255,255,0.94);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        #memo {
            width: 100%;
            min-height: 60vh;
            resize: vertical;
            box-sizing: border-box;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
            line-height: 1.6;
        }
        .memo-actions {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .memo-actions button {
            padding: 9px 14px;
            border: 1px solid #007bff;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }
        #memo-status {
            margin-top: 8px;
            font-size: 0.9em;
            opacity: 0.75;
        }
    </style>
</head>
<body>
<button type="button" class="menu-button" onclick="toggleMenu()" aria-label="メニューを開く">☰ メニュー</button>
<nav id="sideMenu" class="side-menu">
<h2>メニュー</h2>
<a href="../">🏠 ホーム</a>
<a href="dice.html">🎲 ダイス</a>
<a href="member.html">🙍 バッチ取得者への待遇</a>
<a href="materials.html">🖼 使用素材</a>
<a href="business.html">💼 企業様への連絡</a>
<a href="../debug.html">⚙ デバック</a>
<a href="login.html">🔐 ログイン</a>
</nav>
    <div class="memo-page">
        <div class="memo-box">
            <h1>📝 メモ帳</h1>
            <p>このメモは、このブラウザのローカルストレージに保存されます。</p>
            <textarea id="memo" placeholder="ここにメモを入力してください……"></textarea>
            <div class="memo-actions">
                <button type="button" id="save-memo">保存</button>
                <button type="button" id="clear-memo">クリア</button>
            </div>
            <div id="memo-status" aria-live="polite">読み込み中…</div>
        </div>
    </div>
    <script src="memo.js"></script>
<!-- 共通アカウント状態 -->
<div id="account-status" class="account-status-collapsed"
     role="button"
     tabindex="0"
     aria-expanded="false"
     aria-label="アカウント状態を開く">
    <div id="account-status-toggle" aria-hidden="true">☰</div>
    <div id="account-status-panel">
        <h3>アカウント状態</h3>
        <div id="account-status-content">読み込み中...</div>
    </div>
</div>
<script src="../account-status.js"></script>
<script>
function toggleMenu() {
    const menu = document.getElementById("sideMenu");
    menu.classList.toggle("open");
}

document.querySelectorAll("#sideMenu a").forEach(link => {
    link.addEventListener("click", function() {
        document.getElementById("sideMenu").classList.remove("open");
    });
});
</script>
</body>
</html>
